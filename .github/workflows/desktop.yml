name: Cross-platform desktop
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: windows-x64
          - os: macos-15
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x64
          - os: ubuntu-22.04
            label: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Windows C toolchain
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          location: C:\msys64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-clang-tools-extra mingw-w64-ucrt-x86_64-gdb
      - name: Expose Windows toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH '${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin'
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential clang clangd clang-format libgtk-3-0 libnss3 libasound2 libgbm1 xvfb
      - run: npm ci
      - run: npm run doctor
      - run: npm test
      - run: npm run test:legacy
      - run: npm run test:course
      - run: python tests/course-exercises.test.py
      - run: python tests/intro-lessons.test.py
      - name: Desktop window and IPC smoke test
        if: runner.os != 'Linux'
        run: npm run smoke
      - name: Desktop window and IPC smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke
      - name: Build distributables
        run: npm run dist
      - name: Verify packaged desktop
        if: runner.os != 'Linux'
        run: node scripts/test-packaged.cjs
      - name: Verify packaged desktop (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/test-packaged.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: CPractice-${{ matrix.label }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.tar.gz
            tests/reports/desktop-smoke.json
            tests/reports/packaged-smoke.json
          if-no-files-found: error
          retention-days: 14
